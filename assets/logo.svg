  <rect x="56" y="31" width="13" height="13" fill="#F59E0B" opacity="0.8"/>
  
  <!-- AI Brain Symbol -->
  <circle cx="82" cy="65" r="25" fill="url(#grad2)" opacity="0.9"/>
  <path d="M75 65 Q75 55 82 55 Q89 55 89 65 Q89 75 82 75 Q75 75 75 65" 
